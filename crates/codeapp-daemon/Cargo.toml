[package]
name = "codeapp-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unix socket server: hello/attach, request routing to core, event streaming, idle shutdown"

[dependencies]
codeapp-types = { workspace = true }
codeapp-config = { workspace = true }
codeapp-core = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "signal", "fs"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
