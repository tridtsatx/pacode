[package]
name = "pacode-outline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Structural outlines of source files (signatures kept, bodies elided) via tree-sitter"

# Each grammar is a feature. Approximate stripped size of each compiled grammar (gcc -O2):
#   csharp 5.1 MiB, swift 3.9, cpp 3.3, kotlin 3.3, ruby 2.0, tsx 1.4, typescript 1.4,
#   bash 1.3, rust 1.1, php 1.1, c 0.6, python 0.5, javascript 0.4, java 0.4,
#   markdown 0.35, go 0.2, yaml 0.2, toml 0.04, json 0.02 (+ tree-sitter runtime ~0.2).
# All: ~26.5 MiB. `lang-core` alone: ~7.8 MiB. `typescript` covers TypeScript and TSX.
[features]
default = ["all-languages"]
all-languages = ["lang-core", "lang-extra"]
lang-core = ["rust", "typescript", "javascript", "python", "go", "java", "c", "bash", "json", "toml", "yaml", "markdown"]
lang-extra = ["cpp", "csharp", "kotlin", "ruby", "php", "swift"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript"]
javascript = ["dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
go = ["dep:tree-sitter-go"]
java = ["dep:tree-sitter-java"]
c = ["dep:tree-sitter-c"]
cpp = ["dep:tree-sitter-cpp"]
csharp = ["dep:tree-sitter-c-sharp"]
kotlin = ["dep:tree-sitter-kotlin-ng"]
ruby = ["dep:tree-sitter-ruby"]
php = ["dep:tree-sitter-php"]
swift = ["dep:tree-sitter-swift"]
bash = ["dep:tree-sitter-bash"]
json = ["dep:tree-sitter-json"]
toml = ["dep:tree-sitter-toml-ng"]
yaml = ["dep:tree-sitter-yaml"]
markdown = ["dep:tree-sitter-md"]

[dependencies]
thiserror = { workspace = true }
# 0.26: `Parser::parse_with_options` + progress callback (set_timeout_micros is gone),
# grammar ABI 13..=15. Grammar crates depend only on `tree-sitter-language` 0.1.
tree-sitter = "0.26"
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-php = { version = "0.25.1", optional = true }
tree-sitter-swift = { version = "0.7.4", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
