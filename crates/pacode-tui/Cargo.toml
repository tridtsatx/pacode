[package]
name = "pacode-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "ratatui client: dialog, rail (plan/agents/background/session), agent panel, input, footer"

[dependencies]
pacode-types = { workspace = true }
pacode-config = { workspace = true }
pacode-client = { workspace = true }
pacode-render = { workspace = true }
pacode-import = { workspace = true }
pacode-image = { workspace = true }
base64 = { workspace = true }
# Local `git status`/`git diff` probes for the Files menu level (§5.5) — the
# crate carries no ratatui and its calls run on spawned tasks, never in draw.
pacode-vcs = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process"] }
futures = { workspace = true }
ignore = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
arboard = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
image = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
# `test-util` for the paused clock the ticker's phase tests run on: the ticker
# deadlines are a property of the arithmetic, and a real clock would only make
# them flaky. Nothing in the crate's own code path pulls it in.
tokio = { workspace = true, features = ["test-util"] }
