[package]
name = "pacode-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session and agent runtime: turn loop, injections, permissions, compaction, plan, subagents"

[dependencies]
pacode-types = { workspace = true }
pacode-config = { workspace = true }
pacode-skills = { workspace = true }
pacode-provider = { workspace = true }
pacode-tools = { workspace = true }
pacode-exec = { workspace = true }
pacode-mcp = { workspace = true }
pacode-plugin = { workspace = true }
pacode-store = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs", "process"] }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
pretty_assertions = { workspace = true }
