[package]
name = "codeapp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daemon connection: autospawn, reconnect with backoff, typed request/reply API, event stream"

[dependencies]
codeapp-types = { workspace = true }
codeapp-config = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "process", "fs"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
