[package]
name = "pacode-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Networking and proxy configuration for pacode"

[dependencies]
# `http2` is enabled here (not in the workspace default) because the keep-alive tuning below
# needs it; cargo unifies the feature for every crate that shares this reqwest.
reqwest = { workspace = true, features = ["http2"] }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
