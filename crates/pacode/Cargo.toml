[package]
name = "pacode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pacode: background-first TUI coding agent (client + daemon)"

[[bin]]
name = "pacode"
path = "src/main.rs"

[dependencies]
pacode-types = { workspace = true }
pacode-config = { workspace = true }
pacode-client = { workspace = true }
pacode-daemon = { workspace = true }
pacode-tui = { workspace = true }
pacode-plugin = { workspace = true }
pacode-import = { workspace = true }
toml_edit = { workspace = true }
clap = { workspace = true, features = ["color"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
serde_json = { workspace = true }
log = { workspace = true }
libc = { workspace = true }
shlex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
mimalloc = []
