[package]
name = "codeapp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session and agent runtime: turn loop, injections, permissions, compaction, plan, subagents"

[dependencies]
codeapp-types = { workspace = true }
codeapp-config = { workspace = true }
codeapp-provider = { workspace = true }
codeapp-tools = { workspace = true }
codeapp-exec = { workspace = true }
codeapp-mcp = { workspace = true }
codeapp-store = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs", "process"] }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
pretty_assertions = { workspace = true }
