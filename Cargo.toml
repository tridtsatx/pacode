[workspace]
resolver = "3"
members = [
    "crates/pacode-types",
    "crates/pacode-config",
    "crates/pacode-risk",
    "crates/pacode-render",
    "crates/pacode-exec",
    "crates/pacode-provider",
    "crates/pacode-mcp",
    "crates/pacode-store",
    "crates/pacode-tools",
    "crates/pacode-core",
    "crates/pacode-daemon",
    "crates/pacode-client",
    "crates/pacode-tui",
    "crates/pacode",
    "crates/pacode-plugin",
    "crates/pacode-import",
    "crates/pacode-image",
    "crates/pacode-skills",
    "crates/pacode-acp",
    "crates/pacode-auth",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/tridtsatx/pacode"
homepage = "https://github.com/tridtsatx/pacode"
readme = "README.md"
keywords = ["cli", "tui", "agent", "llm", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
pacode-types = { path = "crates/pacode-types", version = "0.1.3" }
pacode-config = { path = "crates/pacode-config", version = "0.1.3" }
pacode-risk = { path = "crates/pacode-risk", version = "0.1.3" }
pacode-render = { path = "crates/pacode-render", version = "0.1.3" }
pacode-exec = { path = "crates/pacode-exec", version = "0.1.3" }
pacode-provider = { path = "crates/pacode-provider", version = "0.1.3" }
pacode-mcp = { path = "crates/pacode-mcp", version = "0.1.3" }
pacode-store = { path = "crates/pacode-store", version = "0.1.3" }
pacode-tools = { path = "crates/pacode-tools", version = "0.1.3" }
pacode-core = { path = "crates/pacode-core", version = "0.1.3" }
pacode-daemon = { path = "crates/pacode-daemon", version = "0.1.3" }
pacode-client = { path = "crates/pacode-client", version = "0.1.3" }
pacode-tui = { path = "crates/pacode-tui", version = "0.1.3" }
pacode-plugin = { path = "crates/pacode-plugin", version = "0.1.3" }
pacode-import = { path = "crates/pacode-import", version = "0.1.3" }
pacode-image = { path = "crates/pacode-image", version = "0.1.3" }
pacode-skills = { path = "crates/pacode-skills", version = "0.1.3" }
pacode-acp = { path = "crates/pacode-acp", version = "0.1.3" }
pacode-auth = { path = "crates/pacode-auth", version = "0.1.3" }

# async
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

# errors / logging
thiserror = "2"
anyhow = "1"
log = { version = "0.4", features = ["release_max_level_warn"] }
tracing = "0.1"

# http
flate2 = "1"
tar = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "rustls-tls-native-roots", "system-proxy"] }
url = "2"
dom_smoothie = "0.18.1"
htmd = "0.5.5"

# terminal
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.12", default-features = false }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

# fs / search
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
similar = "2"
dirs = "5"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
libc = "0.2"
regex = "1"
shlex = "1"
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# dev
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"

# plugins
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "serialize"] }
wasmtime = { version = "48", default-features = false, features = ["component-model", "cranelift", "runtime", "async", "wat"] }
wasmtime-wasi = "48"

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 0

# Hot loops of the terminal/render stack stay optimized in dev builds (same rationale as jcode).
[profile.dev.package.ratatui]
opt-level = 3
[profile.dev.package.ratatui-core]
opt-level = 3
[profile.dev.package.ratatui-widgets]
opt-level = 3
[profile.dev.package.ratatui-crossterm]
opt-level = 3
[profile.dev.package.crossterm]
opt-level = 3
[profile.dev.package.unicode-width]
opt-level = 3
[profile.dev.package.unicode-segmentation]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.rusqlite]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
strip = "symbols"
panic = "unwind"

[profile.test]
debug = 0
incremental = true
